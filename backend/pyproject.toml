[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shopagent-core"
version = "0.1.0"
description = "Core LangGraph agent, RAG, and tools for ShopAgent-OS - import into your own Python backend."
requires-python = ">=3.12"
dependencies = [
    "groq>=0.37.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "chromadb>=1.5.9",
    "langgraph>=1.2.12",
    "langchain-groq>=1.1.3",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
langfuse = ["langfuse>=4.15.6", "langchain>=1.4.2"]

[tool.setuptools.packages.find]
include = ["shopagent_core*"]
